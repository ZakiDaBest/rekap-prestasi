<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PRESTASI MURID SMA ISLAM AL AZHAR 16 SEMARANG</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
  <link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet'>
  <style>
    body { 
      overflow: hidden;
      font-family: 'Lato', sans-serif; 
      margin:0; 
      padding:0; 
      background: url('/background.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    @media screen and (max-width: 768px) and (orientation: portrait) {
      body {
        background: url('/bg-potrait.jpg') no-repeat center center fixed;
        background-size: cover;
      }
    }
    .carousel-fade .carousel-inner .item {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    .carousel-fade .carousel-inner .active { opacity: 1; }
    html, body, .carousel, .carousel-inner, .carousel-inner .item { 
      height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    .item {
      display: flex; justify-content: center; align-items: center; height: 100%;
    }
    .item img {
      max-height: 100%;
      max-width: 100%;
      margin: auto;
      display: block;
      object-fit: contain;
      background: transparent;
    }
  </style>
</head>
<body>

<div id="carouselFade" class="carousel slide carousel-fade" data-ride="carousel" data-interval="5000">
  <div class="carousel-inner" role="listbox" id="carousel-slides"></div>
</div>

<!-- jQuery + Bootstrap -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>

<script>
  // Ambil daftar file dari GitHub API
  fetch("https://api.github.com/repos/pakfab/rekap-prestasi/contents/img")
    .then(res => res.json())
    .then(files => {
      const images = files
        .filter(file => file.type === "file") // hanya file
        .map(file => file.download_url);      // ambil URL langsung
  $(document).ready(function() {
    const PRELOAD_AHEAD = 3; // How many images to preload in advance
    let images = [];
    const loaded = new Set();
    const $carousel = $('#carouselFade');

      const container = document.getElementById("carousel-slides");
    function preloadImage(index) {
      return new Promise((resolve, reject) => {
        if (index < 0 || index >= images.length || loaded.has(index)) {
          resolve(); // Already loaded or out of bounds
          return;
        }

      if (images.length === 0) {
        container.innerHTML = `
          <div class="item active" style="background:rgba(0,0,0,0.6);color:#fff;text-align:center;">
            <div class="carousel-caption">
              <h3>Tidak ada gambar</h3>
              <p>Tambahkan file ke folder /img/ di repo</p>
            </div>
          </div>`;
        return;
      }
        const imgElement = $(`#carousel-slides .item[data-index=${index}] img`);
        const src = imgElement.data('src');
        if (!src) {
          resolve(); // No src to load
          return;
        }

      container.innerHTML = images.map((src, idx) => `
        <div class="item ${idx === 0 ? 'active' : ''}">
          <img src="${src}" alt="Slide ${idx+1}">
        </div>
      `).join("");
        const img = new Image();
        img.onload = () => {
          imgElement.attr('src', src);
          imgElement.removeAttr('data-src');
          loaded.add(index);
          resolve();
        };
        img.onerror = reject;
        img.src = src;
      });
    }

      // Jalankan carousel
      $('#carouselFade').carousel({ interval: 5000 });
    })
    .catch(err => {
      console.error("Gagal load gambar:", err);
    });
    // Ambil daftar file dari GitHub API
    fetch("https://api.github.com/repos/pakfab/rekap-prestasi/contents/img")
      .then(res => res.json())
      .then(files => {
        images = files
          .filter(file => file.type === "file")
          .filter(file => file.name.toLowerCase().endsWith('.jpg') || file.name.toLowerCase().endsWith('.jpeg') || file.name.toLowerCase().endsWith('.png') || file.name.toLowerCase().endsWith('.gif'))
          .map(file => file.download_url);

        const container = $("#carousel-slides");

        if (images.length === 0) {
          container.html(`<div class="item active" style="background:rgba(0,0,0,0.6);color:#fff;text-align:center;"><div class="carousel-caption"><h3>Tidak ada gambar</h3><p>Tambahkan file gambar ke folder /img/ di repo.</p></div></div>`);
          return;
        }

        container.html(images.map((src, idx) => `
          <div class="item ${idx === 0 ? 'active' : ''}" data-index="${idx}">
            <img ${idx === 0 ? `src="${src}"` : `data-src="${src}"`} alt="Prestasi Murid ${idx + 1}">
          </div>
        `).join(""));

        if (images.length > 0) {
          loaded.add(0); // Mark first image as loaded
          for (let i = 1; i <= PRELOAD_AHEAD && i < images.length; i++) {
            preloadImage(i);
          }
        }

        $carousel.on('slide.bs.carousel', function (e) {
          const nextIndex = e.relatedTarget.getAttribute('data-index');
          if (nextIndex && !loaded.has(parseInt(nextIndex))) {
            $carousel.carousel('pause');
            preloadImage(parseInt(nextIndex)).then(() => $carousel.carousel('cycle'));
          }
        }).on('slid.bs.carousel', function (e) {
          const currentIndex = e.relatedTarget.getAttribute('data-index') || 0;
          const imageToPreload = parseInt(currentIndex) + PRELOAD_AHEAD;
          preloadImage(imageToPreload);
        });

        $carousel.carousel({ interval: 5000 });
      })
      .catch(err => {
        console.error("Gagal load gambar:", err);
        $("#carousel-slides").html(`<div class="item active" style="background:rgba(0,0,0,0.6);color:#fff;text-align:center;"><div class="carousel-caption"><h3>Gagal memuat gambar dari GitHub</h3><p>Silakan coba muat ulang halaman.</p></div></div>`);
      });
  });
</script>

</body>
</html>
